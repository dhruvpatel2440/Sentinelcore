# eve.json rotation.
#
# `copytruncate` is chosen deliberately over `create`:
#   - `create` renames the file and makes Suricata write to a new inode, which
#     M5's tailer detects via (st_dev, st_ino) and handles by draining the old
#     handle before reopening.
#   - `copytruncate` keeps the same inode and resets its size to 0, which M5
#     detects as `st_size < offset` and handles by seeking back to 0.
#
# M5's tailer handles BOTH, so either is safe. copytruncate is the default here
# because it never requires signalling Suricata, so there is no window where
# the sensor is not writing.

/var/log/suricata/eve.json {
    size 512M
    rotate 5
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

/var/log/suricata/suricata.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
