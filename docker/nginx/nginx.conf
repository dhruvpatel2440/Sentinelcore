upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:5173;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # PCAP uploads: the backend enforces MAX_PCAP_SIZE_MB (500) itself; the
    # global 20m cap would 413 every capture above 20MB before it got there.
    location = /api/pcap/upload {
        client_max_body_size 512m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI backend.
    # No trailing slash on proxy_pass, so the /api prefix is *preserved* and
    # served by the backend itself. That is what makes the auth refresh
    # cookie's path=/api/auth scoping match the URL the browser requests.
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: a client-supplied X-Forwarded-For must not survive,
        # or login/reset throttling and audit IPs can be spoofed.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React dev server (Vite), including HMR websocket
    location / {
        proxy_pass http://frontend_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: a client-supplied X-Forwarded-For must not survive,
        # or login/reset throttling and audit IPs can be spoofed.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
