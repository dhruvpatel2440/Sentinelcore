<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SentinelCore: network detection and incident response you run yourself</title>
    <meta
      name="description"
      content="SentinelCore turns raw network alerts into a short queue of incidents, with firewall containment that always expires. It installs on your own Linux machine and runs entirely locally."
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      /* Apply the saved theme before first paint to avoid a flash. */
      try {
        var t = localStorage.getItem("sc-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
