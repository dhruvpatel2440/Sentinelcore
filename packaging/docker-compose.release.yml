# SentinelCore release stack. Installed to /opt/sentinelcore by the installer.
# Run with both env files (the installer and the `sentinelcore` CLI do this):
#   docker compose -p sentinelcore \
#     --env-file /etc/sentinelcore/sentinelcore.env \
#     --env-file /opt/sentinelcore/release.env \
#     -f /opt/sentinelcore/docker-compose.release.yml up -d
#
# release.env pins image references (tag + digest). Nothing here builds from
# source and nothing bind-mounts source code.

name: sentinelcore

networks:
  sentinelcore-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  helper_socket:
  rule_staging:
  suricata_rules:
  suricata_logs:
  suricata_run:
  report_storage:
  pcap_storage:

x-common-env: &common_env
  env_file: /etc/sentinelcore/sentinelcore.env

services:
  db:
    <<: *common_env
    image: ${DB_IMAGE:?release.env not loaded}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No published ports: only containers on the private network reach Postgres.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [sentinelcore-network]

  redis:
    image: ${REDIS_IMAGE:?release.env not loaded}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [sentinelcore-network]

  # The privilege boundary: root, but a four-capability allowlist, never
  # `privileged: true`. Host networking gives visibility, not reachability:
  # it publishes no port and is only reachable via the 0660 Unix socket.
  helper:
    <<: *common_env
    image: ${HELPER_IMAGE:?release.env not loaded}
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE, CHOWN]
    volumes:
      - helper_socket:/run/sentinelcore
      - suricata_rules:/var/lib/suricata/rules
      - rule_staging:/var/lib/sentinelcore/staging
      - suricata_logs:/var/log/suricata
      - suricata_run:/var/run/suricata
      - /opt/sentinelcore/suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
    healthcheck:
      test: ["CMD", "test", "-S", "/run/sentinelcore/helper.sock"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    network_mode: host

  backend:
    <<: *common_env
    image: ${BACKEND_IMAGE:?release.env not loaded}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      HELPER_SOCKET_PATH: /run/sentinelcore/helper.sock
      ENVIRONMENT: production
    volumes:
      - helper_socket:/run/sentinelcore
      - rule_staging:/var/lib/sentinelcore/staging
      - suricata_logs:/var/log/suricata:ro
      - report_storage:/var/lib/sentinelcore/reports
      - pcap_storage:/var/lib/sentinelcore/pcap
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    expose: ["8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      helper: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks: [sentinelcore-network]

  worker:
    <<: *common_env
    image: ${BACKEND_IMAGE:?release.env not loaded}
    command: ["python", "-m", "app.pipeline.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "false"
      HELPER_SOCKET_PATH: /run/sentinelcore/helper.sock
      ENVIRONMENT: production
    volumes:
      - suricata_logs:/var/log/suricata:ro
      - report_storage:/var/lib/sentinelcore/reports
      - pcap_storage:/var/lib/sentinelcore/pcap
      - helper_socket:/run/sentinelcore
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    networks: [sentinelcore-network]

  frontend:
    image: ${FRONTEND_IMAGE:?release.env not loaded}
    expose: ["8080"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [sentinelcore-network]

  # Only service that publishes host ports.
  nginx:
    image: ${NGINX_IMAGE:?release.env not loaded}
    environment:
      PUBLIC_HTTPS_SUFFIX: ${PUBLIC_HTTPS_SUFFIX:-}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-300}
    volumes:
      - /opt/sentinelcore/nginx/nginx.release.conf:/etc/nginx/templates/default.conf.template:ro
      - /etc/sentinelcore/tls:/etc/nginx/certs:ro
    ports:
      - "${LISTEN_ADDRESS:-127.0.0.1}:${HTTP_PORT:-80}:80"
      - "${LISTEN_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-443}:443"
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [sentinelcore-network]
