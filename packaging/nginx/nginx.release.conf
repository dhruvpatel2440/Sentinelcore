# Rendered by the nginx image's envsubst at start (templates/ mechanism).
# Only these variables are substituted: PUBLIC_HTTPS_SUFFIX, HSTS_MAX_AGE.
# server_tokens off and TLS 1.2+ only.

server_tokens off;

upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:8080;
}

server {
    listen 80 default_server;
    server_name _;
    # PUBLIC_HTTPS_SUFFIX is "" for 443 and ":<port>" otherwise.
    return 301 https://$host${PUBLIC_HTTPS_SUFFIX}$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/sentinelcore.crt;
    ssl_certificate_key /etc/nginx/certs/sentinelcore.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Short max-age by default: the shipped certificate is self-signed and a
    # long HSTS lifetime stops browsers offering the "proceed anyway" option.
    add_header Strict-Transport-Security "max-age=${HSTS_MAX_AGE}" always;

    # No trailing slash on proxy_pass: the /api prefix is preserved, which the
    # refresh cookie's path=/api/auth scoping depends on.
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
